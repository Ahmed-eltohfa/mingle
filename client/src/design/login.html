<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-primary": "#ffffff",
                      "outline-variant": "#c7c4d7",
                      "on-tertiary-container": "#fffbff",
                      "on-surface": "#0b1c30",
                      "tertiary-fixed-dim": "#ffb783",
                      "error-container": "#ffdad6",

                      "on-tertiary-fixed-variant": "#703700",
                      "surface-container-highest": "#d3e4fe",
                      "primary": "#4648d4",
                      "surface-container": "#e5eeff",
                      "tertiary-container": "#b55d00",
                      "surface-container-high": "#dce9ff",
                      "secondary-fixed-dim": "#89ceff",
                      "primary-fixed": "#e1e0ff",
                      "on-primary-fixed-variant": "#2f2ebe",
                      "surface-container-lowest": "#ffffff",
                      "surface": "#f8f9ff",
                      "on-background": "#0b1c30",
                      "surface-container-low": "#eff4ff",
                      "on-secondary-container": "#004666",
                      "on-error": "#ffffff",
                      "error": "#ba1a1a",
                      "on-secondary-fixed-variant": "#004c6e",
                      "primary-container": "#6063ee",
                      "on-secondary": "#ffffff",
                      "secondary": "#006591",
                      "surface-bright": "#f8f9ff",
                      "surface-tint": "#494bd6",
                      "on-tertiary": "#ffffff",
                      "secondary-container": "#39b8fd",
                      "secondary-fixed": "#c9e6ff",
                      "on-primary-container": "#fffbff",
                      "on-surface-variant": "#464554",
                      "inverse-on-surface": "#eaf1ff",
                      "inverse-primary": "#c0c1ff",
                      "on-secondary-fixed": "#001e2f",
                      "tertiary": "#904900",
                      "on-tertiary-fixed": "#301400",
                      "primary-fixed-dim": "#c0c1ff",
                      "background": "#f8f9ff",
                      "tertiary-fixed": "#ffdcc5",
                      "inverse-surface": "#213145",
                      "surface-variant": "#d3e4fe",
                      "outline": "#767586",
                      "on-primary-fixed": "#07006c",
                      "surface-dim": "#cbdbf5"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-desktop": "48px",
                      "margin-mobile": "16px",
                      "lg": "24px",
                      "md": "16px",
                      "xs": "4px",
                      "sm": "8px",
                      "xl": "32px",
                      "base": "4px",
                      "gutter": "16px"
              },
              "fontFamily": {
                      "display-lg": ["Inter", "sans-serif"],
                      "label-sm": ["Inter", "sans-serif"],

              },
              "fontSize": {
                      "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "label-sm": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500" }],
                      "display-lg-mobile": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                      "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                      "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],

                      "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
              }
            }
          }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom subtle grid background for the minimalist requirement */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(199, 196, 215, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(199, 196, 215, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden antialiased">
<!-- Minimalist decorative background elements -->
<div class="absolute inset-0 bg-grid-pattern z-0 pointer-events-none"></div>
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-fixed opacity-40 blur-[100px] z-0 pointer-events-none"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary-fixed opacity-40 blur-[100px] z-0 pointer-events-none"></div>
<!-- Main Login Card -->
<main class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant/50 rounded-xl shadow-[0_20px_25px_-5px_rgb(0,0,0,0.05),0_8px_10px_-6px_rgb(0,0,0,0.01)] z-10 p-xl flex flex-col gap-lg transition-transform hover:-translate-y-1 duration-300">
<!-- Header -->
<div class="flex flex-col items-center justify-center space-y-xs mb-sm">
<h1 class="font-display-lg text-display-lg md:font-display-lg md:text-display-lg text-primary tracking-tight">Mingle</h1>
<h2 class="font-headline-md text-headline-md text-on-surface mt-sm">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Enter your details to access your account.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
</div>
<input class="w-full pl-xl pr-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition-all duration-200" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input class="w-full pl-xl pr-xl py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/30 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline-variant hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-xs mb-sm">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest bg-surface-container-lowest cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="ml-sm font-label-sm text-label-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember me</label>
</div>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm py-md rounded-lg shadow-[0_4px_6px_-1px_rgb(0,0,0,0.1)] hover:bg-surface-tint hover:-translate-y-[1px] active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-xs" type="submit">
                Login
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="mt-sm text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-sm text-label-sm text-primary font-semibold hover:underline underline-offset-4" href="#">Create an account</a>
</p>
</div>
</main>
<script>
        // Password Visibility Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');

            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if (type === 'text') {
                    visibilityIcon.textContent = 'visibility_off';
                    visibilityIcon.classList.add('text-primary');
                    visibilityIcon.classList.remove('text-outline-variant');
                } else {
                    visibilityIcon.textContent = 'visibility';
                    visibilityIcon.classList.remove('text-primary');
                    visibilityIcon.classList.add('text-outline-variant');
                }
            });
        });
    </script>
</body></html>
