@if (isLoading()) {
<div class="loading">Loading profile...</div>
} @else if (user(); as currentUser) {
<section class="profile-page mingle-card">
    <header class="profile-header">
        <div class="cover"></div>

        <div class="identity-row">
            <img class="avatar" [src]="getAvatarUrl(currentUser)" [alt]="currentUser.name + ' avatar'" />

            <div class="header-actions">
                <span class="material-symbols-outlined">share</span>
                <button type="button" class="ghost-button" routerLink="/edit-profile">Edit Profile</button>
            </div>
        </div>

        <div class="profile-info">
            <h1>{{ currentUser.name }}</h1>
            <p class="handle">&#64;{{ currentUser.username }}</p>
            <p class="bio">{{ currentUser.bio || 'No bio provided yet.' }}</p>
            <p class="stats">
                <span><strong>0</strong> Following</span>
                <span><strong>0</strong> Followers</span>
            </p>
        </div>

        <nav class="tab-row" aria-label="Profile tabs">
            <button type="button" class="is-active">Posts</button>
            <button type="button">Media</button>
            <button type="button">Saved</button>
        </nav>
    </header>

    <div class="gallery-grid">
        @for (image of gallery; track image) {
        <article class="gallery-item">
            <img [src]="image" alt="Profile media" loading="lazy" />
        </article>
        }
    </div>
</section>
}
