<header class="top-bar">
    <a class="top-brand" routerLink="/home">Mingle</a>
    <div class="top-actions">
        <a class="top-icon" routerLink="/create" aria-label="Create post">
            <span class="material-symbols-outlined">add_circle</span>
        </a>
        <a class="top-icon" routerLink="/notifications" aria-label="Open notifications">
            <span class="material-symbols-outlined">notifications</span>
        </a>
        <a class="top-icon" routerLink="/messages" aria-label="Open messages">
            <span class="material-symbols-outlined">mail</span>
        </a>
        <button type="button" class="top-icon logout-btn" (click)="handleLogout()" aria-label="Log out">
            <span class="material-symbols-outlined">logout</span>
        </button>
    </div>
</header>
